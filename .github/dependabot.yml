version: 2
updates:
  # Keep the GitHub Actions in .github/workflows/ on supported Node runtimes.
  # Without this, an action that drops Node 20 / Node 24 support silently
  # turns CI red the day GitHub flips the default runtime.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  # Gradle plugins and libraries from android/gradle/libs.versions.toml.
  # Monthly and grouped so F-Droid-reproducible releases are not churned
  # by a stream of single-library bumps.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: build
      include: scope
    # Major Gradle / AGP jumps need a coordinated, hand-made migration
    # (see the 2026-11 toolchain upgrade), never a standalone bump.
    ignore:
      - dependency-name: gradle-wrapper
        update-types: [version-update:semver-major]
      - dependency-name: com.android.application
        update-types: [version-update:semver-major]
    groups:
      # Gradle, AGP and Kotlin depend on each other; bump them together.
      toolchain:
        patterns:
          - gradle-wrapper
          - com.android.application
          - org.jetbrains.kotlin*
      gradle-minor-and-patch:
        update-types:
          - minor
          - patch
