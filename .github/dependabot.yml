version: 2
updates:
  # Keep the GitHub Actions in .github/workflows/ on supported Node runtimes.
  # Without this, an action that drops Node 20 / Node 24 support silently
  # turns CI red the day GitHub flips the default runtime.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions-minor-and-patch:
        update-types:
          - minor
          - patch

  # Gradle plugins and libraries from android/gradle/libs.versions.toml.
  # Monthly and grouped so F-Droid-reproducible releases are not churned
  # by a stream of single-library bumps.
  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: build
      include: scope
    groups:
      gradle-minor-and-patch:
        update-types:
          - minor
          - patch
